# CPU-only deployment (no NVIDIA GPU required)
# Usage: docker compose -f docker-compose.cpu.yml up --build -d

services:
  deepguard:
    build:
      context: .
      dockerfile: Dockerfile.full
    ports:
      - "8080:8000"
    environment:
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
    volumes:
      - model-cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  model-cache:
