services:
  deepguard:
    build:
      context: .
      dockerfile: Dockerfile.full
    ports:
      - "8080:8000"
    gpus: all
    environment:
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
    volumes:
      - model-cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  model-cache:
